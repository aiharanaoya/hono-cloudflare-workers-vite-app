name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN
          }}">>~/.npmrc
      - uses: renovatebot/github-action@v46.1.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
